name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          find server public/js mock tests -name '*.js' -print -o -name '*.mjs' -print | xargs -n1 node --check
      - name: Unit tests
        run: npm run unit
      - name: End-to-end smoke
        run: npm run smoke

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build --pull -t homedeck:ci .
      - name: Verify pinned Node.js runtime
        run: test "$(docker run --rm --entrypoint node homedeck:ci -v)" = "v24.22.1"
      - name: Verify hardened entrypoint
        run: |
          test "$(docker run --rm \
            --cap-drop ALL \
            --cap-add CHOWN --cap-add FOWNER --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            --tmpfs /data \
            -e UID=99 -e GID=100 -e UMASK=077 \
            homedeck:ci node -v)" = "v24.22.1"

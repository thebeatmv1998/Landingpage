name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          find server public/js mock tests -name '*.js' -print -o -name '*.mjs' -print | xargs -n1 node --check
      - name: Unit tests
        run: npm run unit
      - name: End-to-end smoke
        run: npm run smoke

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --pull -t homedeck:ci .
      - name: Verify pinned Node.js runtime
        run: test "$(docker run --rm --entrypoint node homedeck:ci -v)" = "v24.22.1"

services:
  homedeck:
    build: .
    image: homedeck-usenet:latest
    container_name: homedeck
    restart: unless-stopped
    ports:
      - "8753:8000"
    volumes:
      - /mnt/user/appdata/homedeck:/data
      # Der Docker-Socket wird bewusst NICHT standardmäßig gemountet: Er gibt
      # Host-Kontrolle. Für das Docker-Widget einen filternden Socket-Proxy nutzen.
    environment:
      - UID=99
      - GID=100
      - UMASK=022
      - TZ=Europe/Berlin
      # Auf 1 setzen, wenn HomeDeck hinter einem HTTPS-Reverse-Proxy läuft:
      - TRUST_PROXY=0
      - SECURE_COOKIES=0
    security_opt:
      - no-new-privileges:true

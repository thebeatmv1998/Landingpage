services:
  homedeck:
    build: .
    container_name: homedeck
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - homedeck-data:/data
      # The Docker socket is intentionally NOT mounted by default. It grants
      # host-level control, and a ":ro" mount is not a security boundary for the
      # Docker API. If you need the Docker widget, use a filtering socket proxy.
    environment:
      - UID=99
      - GID=100
      - UMASK=077
      - TZ=Europe/Berlin
      # Set to 1 when running behind an HTTPS reverse proxy (affects OAuth redirects + secure cookies)
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - SECURE_COOKIES=${SECURE_COOKIES:-0}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID

volumes:
  homedeck-data:
